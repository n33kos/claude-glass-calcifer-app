<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="glass-app://sdk/glass-app.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* Lines are kept short (shortLines), so the size holds; size and color are settings (--sub-scale, --sub-color) */
  #sub { position: fixed; left: 50%; bottom: 4%; transform: translateX(-50%); width: min(92%, 34em);
    text-align: center; font: 600 calc(clamp(15px, 2.6vmin, 30px) * var(--sub-scale, 1))/1.3 var(--font-sans, system-ui);
    color: var(--sub-color, #fff3cf); text-wrap: balance;
    text-shadow: 0 1px 3px #000, 0 0 12px rgba(0,0,0,.8); pointer-events: none; opacity: 0; transition: opacity .25s; }
  #sub.on { opacity: 1; }
  #status { position: fixed; left: 10px; top: 8px; right: 10px; font: 12px/1.3 var(--font-sans, system-ui);
    color: #ffcf9e; text-shadow: 0 1px 2px #000; pointer-events: none; }
  /* His insides: the live terminal, in the dark heart of his flame (terminal.js). --z is how far
     he has opened up, 0..1, set every frame. Its width is set from the frame too, leaving a
     margin either side for his eyes; this is only the first frame's. */
  #core { position: fixed; left: 50%; top: 16vh; width: min(80vw, 1100px); height: 66vh; box-sizing: border-box;
    transform: translateX(-50%) scale(calc(.9 + .1 * var(--z, 0))); opacity: var(--z, 0); visibility: hidden;
    display: flex; flex-direction: column; padding: 36px 22px 10px; border-radius: 28px;
    /* See-through enough that his flame moves behind the text. No backdrop blur: over an animated
       canvas that is a full re-blur every frame. */
    background: radial-gradient(ellipse 75% 70% at 50% 48%, rgba(30, 4, 0, .72) 0%, rgba(40, 6, 0, .6) 60%, rgba(60, 10, 0, .32) 100%);
    box-shadow: inset 0 0 50px 8px rgba(255, 80, 10, .28), 0 0 60px 20px rgba(40, 4, 0, .35); }
  /* The text burns: one small glow (it only repaints when a snapshot changes a row) */
  #coreTerm .xterm-rows { text-shadow: 0 0 4px rgba(255, 70, 0, .55); }
  #core.on { visibility: visible; }
  #coreTerm { flex: 1 1 auto; min-height: 0; }
  /* xterm paints its viewport black and keeps a native scrollbar behind its own: both go, so the
     core shows through and only xterm's (ember-tinted) slider remains */
  #coreTerm .xterm, #coreTerm .xterm-screen, #coreTerm .xterm-viewport { background: transparent !important; }
  #coreTerm .xterm-viewport { scrollbar-width: none; }
  #coreTerm .xterm-viewport::-webkit-scrollbar { display: none; }
  /* ...and that slider stays put: xterm fades it out unless you're hovering or scrolling, which in
     his core read as no scrollbar at all */
  #coreTerm .xterm-scrollable-element > .scrollbar.vertical,
  #coreTerm .xterm-scrollable-element > .scrollbar.vertical.invisible { opacity: 1 !important; }
  #coreTerm .xterm-scrollable-element > .scrollbar.vertical > .slider { background: rgba(255, 150, 70, .42) !important; border-radius: 5px; }
  #coreTerm .xterm-scrollable-element > .scrollbar.vertical > .slider:hover { background: rgba(255, 170, 90, .65) !important; }
  #coreMsg { position: absolute; inset: 0; display: none; place-content: center; text-align: center; padding: 0 12%;
    font: 14px/1.5 var(--font-sans, system-ui); color: #ffdcae; }
  #coreMsg.on { display: grid; }
  #coreMsg code { font-family: var(--font-mono, ui-monospace, monospace); background: rgba(255, 140, 60, .14); padding: .1em .4em; border-radius: 4px; user-select: all; }
  #coreBar { flex: none; display: flex; gap: 6px; justify-content: center; padding-top: 8px; opacity: .55; transition: opacity .2s; }
  #core:hover #coreBar { opacity: 1; }
  #coreBar button { all: unset; cursor: pointer; padding: 3px 9px; border-radius: 6px; font: 12px/1.4 var(--font-mono, ui-monospace, monospace);
    color: #ffdcae; background: rgba(255, 140, 60, .12); box-shadow: inset 0 0 0 1px rgba(255, 160, 80, .25); }
  #coreBar button:hover { background: rgba(255, 140, 60, .28); color: #fff1d6; }
  #coreBar .gap { width: 14px; }
  /* Close: one of the bar's buttons, in the panel's top-left corner (the panel's top padding keeps
     it off the text) */
  #coreClose { all: unset; position: absolute; left: 14px; top: 9px; cursor: pointer; padding: 1px 8px; border-radius: 6px;
    font: 12px/1.4 var(--font-mono, ui-monospace, monospace); color: #ffdcae;
    background: rgba(255, 140, 60, .12); box-shadow: inset 0 0 0 1px rgba(255, 160, 80, .25); opacity: .55; transition: opacity .2s; }
  #core:hover #coreClose { opacity: 1; }
  #coreClose:hover { background: rgba(255, 140, 60, .28); color: #fff1d6; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="sub"></div>
<div id="status"></div>
<div id="core">
  <div id="coreTerm"></div>
  <div id="coreMsg"></div>
  <div id="coreBar">
    <button data-key="C-c" title="Ctrl+C">^C</button><button data-key="Escape" title="Escape">Esc</button>
    <button data-key="Tab" title="Tab">Tab</button><button data-lit="backtab" title="Shift+Tab (Claude's mode)">⇧Tab</button>
    <button data-key="Up" title="Up arrow">↑</button><button data-key="Down" title="Down arrow">↓</button>
    <span class="gap"></span>
    <button data-act="refit" title="Resize the real tmux pane to fit his core">Fit pane</button>
  </div>
  <button id="coreClose" title="Close (or click outside the terminal)">✕</button>
</div>
<script src="glass-app://sdk/glass-app.js"></script>
<script src="terminal.js?v=4"></script><!-- bump ?v= when the terminal changes -->
<script src="persona/calcifer.js?v=7"></script><!-- bump ?v= when the persona changes -->
<script src="lipsync.js?v=1"></script><!-- bump ?v= when lip sync changes -->
<script src="ears.js?v=25"></script><!-- bump ?v= when the ears change -->
<script src="sounds.js?v=4"></script><!-- bump ?v= when the sounds change -->
<script src="vendor/ort/ort.wasm.min.js"></script><!-- ONNX Runtime Web, wasm only (vendored, 1.30.0) -->
<script src="wake/spotter.js?v=5"></script><!-- hears his name locally; bump ?v= when it changes -->
<script src="assets/sway.js?v=27"></script><!-- bump ?v= when the scene's images change -->

<script>
/*
 * Calcifer, after the film: a soft glowing flame (yellow core, orange body, red licking tips)
 * with cream eyes, dot pupils and a red mouth, hugging a log in a painted hearth.
 *
 * Layers, back to front: the painted hearth (assets/hearth-bare.jpg, plus the hanging herbs as
 * swaying layers) lit by him, his body (a WebGL
 * flame shader), then his face, the log (assets/log.png, cut from the painting) and his arms over
 * it. The painting and the flame render offscreen; only one canvas is on screen.
 *
 * Everything he does is a rig parameter:
 *   body:  size, lean, sway (flame speed), heat (palette), impulse (flare/sputter)
 *   eyes:  eye (scale), lid (upper lid 0..1), tilt (+ = inner corners down, angry),
 *          smileEyes (cheeks push up), pupil (size), px/py (gaze), squint
 *   mouth: open (0..1), wide (0 round .. 1 wide), curve (-1 frown .. 1 smile), teeth
 *   arms:  hug (how tightly he holds the log)
 * Moods are poses (partial parameter sets). On top run blinks, glances, flicker and speech
 * (visemes from the reply text). Another renderer (a Rive file, say) would take the same params.
 */

// ---------- The painted hearth and where the log sits in it (fractions of the image) ----------
// Paths come from assets/sway.js (versioned, so the page never shows a stale copy)
const HEARTH = { src: window.HEARTH_SRC || 'assets/hearth-bare.jpg', w: 2528, h: 1696 }; // without the hanging things (they're layers)
// Where log.png sits in the painting (fractions; from sway.js, since the hand-cut file's crop can
// change), the log's center, and the height of its top edge (he sits just behind that).
const LOG = { src: window.LOG_SRC || 'assets/log.png', ...(window.LOG_RECT || { x: 0.37184, y: 0.69575, w: 0.25119, h: 0.15625 }),
  cx: 0.4982, topY: 0.72700, span: 0.25119, thick: 0.15625 };

// ---------- The persona: palettes, poses, reactions, idle habits (persona/calcifer.js) ----------
const P = window.PERSONA;
const PAL = P.palettes, BASE = P.base, MOODS = P.moods;
const CORE_LIGHT = [1.0, 0.95, 0.68];
const BODY_ALPHA = 0.85; // his flame (body and arms); the face layer has its own opacity in CSS
const EASED = ['size', 'lean', 'sway', 'eye', 'tall', 'lid', 'tilt', 'smileEyes', 'pupil', 'px', 'py', 'open', 'wide', 'curve', 'teeth', 'embers', 'tremble', 'hug', 'armLift'];

// ---------- Speech ----------
// Phoneme-driven mouth shapes live in lipsync.js; this file reaches them through window.LIPSYNC
// (wordAt / mouthAt) as the feed's words arrive.
// Everything his mouth does now comes from the speech feed — the audio itself, every word's timing
// and its phonemes. Two older ways of guessing at it are gone rather than left sitting unreachable:
// a timeline estimated from the text's character count (with `say --text` and `hush`, which only
// pushed to and emptied that queue), and reading loudness and vowel color off a raw audio input.
// Both were approximations of what the feed measures exactly.

// ---------- Speech feed: speech events + audio from a relay ----------
// Any server that speaks the speech-feed protocol (README: "The speech feed") over a WebSocket at
// <url>/ws/client: speech_start / speech_chunk (word timings, optional phonemes) / speech_end
// JSON, plus the audio as binary frames.  The vmux relay is one; it also serves the client
// library this uses (<url>/sdk/vmux-client.js), so the two always match.  The audio is played
// (or, muted, just clocked) here, so every word lands exactly when it's heard.
const feed = { key: '', client: null, player: null, err: '', sessionId: null, loading: null, retryAt: 0, resumeAt: 0 };
async function feedSessionId() {
  if (settings.feedSession) return settings.feedSession;
  const dir = props?.session?.cwd;
  if (!dir) return null;
  const bytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(dir.replace(/\/+$/, '')));
  return [...new Uint8Array(bytes)].map((b) => b.toString(16).padStart(2, '0')).join('').slice(0, 12);
}
function loadFeedLibrary(base) {
  if (window.VmuxClient) return Promise.resolve();
  feed.loading ??= new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = `${base}/sdk/vmux-client.js`;
    s.onload = () => (window.VmuxClient ? resolve() : reject(new Error('feed library did not load')));
    s.onerror = () => { feed.loading = null; reject(new Error(`can't load ${s.src} (is the relay running?)`)); };
    document.head.append(s);
  });
  return feed.loading;
}
function stopFeed() {
  feed.player?.dispose();
  feed.client?.stop();
  Object.assign(feed, { client: null, player: null, sessionId: null, muted: undefined });
}
// Called every frame like listen(): (re)connects when the settings change, else does nothing.
const feedBase = () => (settings.relayUrl || 'http://localhost:3100').replace(/\/+$/, '');
async function useFeed(on) {
  const base = feedBase();
  // The settings pane wins, so a token can be pasted in without the CLI; the stored value stays
  // supported for anyone who set it with `vmux token Calcifer` already.
  const token = (settings.authToken || '').trim() || stored.feedToken || '';
  const key = on ? [base, token, settings.feedSession || props?.session?.cwd || ''].join('|') : '';
  if (key === feed.key) return;
  if (key && performance.now() < feed.retryAt) return; // backing off after a failure
  feed.key = key;
  stopFeed();
  feed.err = '';
  if (!on) return;
  if (!token) {
    feed.err = 'Speech feed needs a token: run `vmux token Calcifer`, then `claude-glass stored calcifer set feedToken \'"<token>"\'`';
    return;
  }
  try {
    await loadFeedLibrary(base);
    const sessionId = await feedSessionId();
    if (feed.key !== key) return; // settings changed meanwhile
    const { RelayClient, SpeechPlayer } = window.VmuxClient;
    const client = new RelayClient({ url: base, token, lockSessionId: sessionId, subscribeAudio: true });
    // He always plays Claude's voice himself, so his mouth and the audio share one clock and the
    // sync is exact. Keep other players muted — he is an ordinary voice client, and two of them
    // playing the same reply is just an echo.
    const player = new SpeechPlayer(client, { muted: false, leadInS: 0.08 });
    client.on('close', ({ code }) => {
      if (code === 4001) feed.err = 'Speech feed rejected the token (revoked or expired?)';
      if (code === 4003) feed.err = 'Speech feed rejected this origin';
    });
    client.on('open', () => { feed.err = ''; });
    client.start();
    player.resume().catch(() => {});
    Object.assign(feed, { client, player, sessionId });
  } catch (e) {
    feed.err = String(e?.message || e);
    feed.key = '';                              // try again...
    feed.retryAt = performance.now() + 5000;    // ...in a few seconds
  }
}
// ---------- His voice: which Kokoro voice the relay speaks this session in ----------
// vmux 5.1+ keeps a voice override per session (session metadata, keyed by the same folder hash
// he follows), used for every reply in that session, his speech feed included. When the Voice
// setting has a name, he sets it each time he joins a session or the name changes; blank, he sends
// nothing and the relay's default voice is used, except to take back an override he set himself
// earlier (remembered in `voiceSet`). Setting session metadata takes a control token, so the
// terminal token is used when there is one.
const tts = { key: '', busy: false, err: '', retryAt: 0 };
function syncVoice() {
  const sid = feed.sessionId, want = (settings.voice ?? '').trim(), was = stored.voiceSet || '';
  if (!sid || !window.VmuxClient || tts.busy || performance.now() < tts.retryAt) return;
  if (!want && !was) return;                     // nothing wanted, nothing of his to take back
  const token = (settings.terminalToken || '').trim() || (settings.authToken || '').trim() || stored.feedToken || '';
  const key = [feedBase(), sid, want, token].join('|');
  if (key === tts.key) return;
  tts.key = key; tts.busy = true;
  const client = new window.VmuxClient.RelayClient({ url: feedBase(), token });
  client.request(`/api/session-metadata/${sid}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ voice_override: want || null }),
  }).then((r) => {
    if (r.ok) {
      tts.err = '';
      if (was !== want) { stored = { ...stored, voiceSet: want }; glass.store({ voiceSet: want }); }
    } else {
      tts.err = r.status === 403 ? 'Setting his voice needs a control token (Settings → Terminal token)'
        : r.status === 404 ? 'This relay has no per-session voices (needs vmux 5.1 or newer)'
        : `Couldn't set his voice (the relay answered ${r.status})`;
    }
  }).catch((e) => {
    tts.err = `Couldn't set his voice: ${e?.message || e}`;
    tts.key = ''; tts.retryAt = performance.now() + 10000;   // the relay may just be restarting
  }).finally(() => { tts.busy = false; });
}

// ---------- His ears (ears.js): the user's mic, and talking to him by name ----------
// The choices are stored values (mic: project, muted: global), set here, by voice, or by Claude
// (`claude-glass app calcifer mic --mode ...`); written locally first so a frame never sees the old one.
// Three postures: "off" (nothing listens), "wake" (his spotter listens here for his name, and the
// mic is open to nothing but it), and "open" (a conversation, mic live in the room). See ears.js.
function setPosture(mic, { called = true } = {}) {
  if ((stored.mic || 'off') === mic) return;
  stored = { ...stored, mic }; glass.store({ mic });
  if (mic !== 'open') return void perform({ react: 'sputter' });
  if (!called) { perform({ mood: 'curious', for: 1, gaze: 'viewer' }); return void onCue('listen'); }
  perform({ mood: 'curious', for: 2, react: 'sparks', gaze: 'viewer' });
  // When he was last asked to listen, for the acknowledge hook. His posture can't be that signal:
  // the relay bumps its silence signal on any noise-only clip, a duplicate audio stream in the room
  // produces one on every utterance, and that drops him straight back out of `open` before the
  // prompt even reaches Claude. This timestamp survives it.
  glass.store({ calledAt: Date.now() });
  // Opening his mic pulls him out of whatever idle stage he had drifted into: onCue resets
  // B.quietSince, and wakes him first if he had gone sleepy or asleep.
  onCue('listen');
}
function setMuted(muted) {
  if (!!stored.muted === muted) return;
  stored = { ...stored, muted }; glass.store({ muted });
  react(muted ? 'sputter' : 'flare');
}
// Spoken commands still reach him, but only through transcripts the relay already made while his
// mic was open ("Calcifer, stop listening") — never from a clip of his own.
// A conversation ending drops him back to "wake" rather than "off": the spotter is the whole point
// of ending gracefully, so his name still reaches him afterwards. Only a click turns him all the
// way off.
window.EARS.onCommand = (cmd) => {
  if (cmd === 'stop') setPosture('wake');
  // The follow-up window: his mic opens by itself for a few seconds after he finishes speaking, so
  // an answer needs no second calling. No `calledAt` stamp and no fanfare — he is still in the
  // conversation they were already having, not being summoned into a new one, and stamping it
  // would have him acknowledge his own follow-up window out loud.
  if (cmd === 'follow') setPosture('open', { called: false });
  if (cmd === 'mute') setMuted(true);
  if (cmd === 'unmute') setMuted(false);
};
// What Claude is doing, remembered between frames so a click can tell "he's busy" from "he's idle".
let lastAgent = 'idle';
// Whether his voice was playing on the previous frame. One frame late is fine for suppressing idle
// fidgets, and it saves asking the player for a frame twice in the same tick.
let lastTalking = false;
// Cut him off and take the turn. The player is stopped here as well as at the relay, because the
// audio already buffered in this window would otherwise keep playing over the interruption.
function bargeIn() {
  try { feed.player?.stopAll(); } catch {}
  window.EARS.barge(feed.sessionId);
  setPosture('open', { called: false });
  perform({ mood: 'curious', for: 2, react: 'sputter', gaze: 'viewer' });
}
// ---------- His spotter (wake/spotter.js): hearing his name without transcribing anything ----------
// Outside his own turn, a wake landing while his voice is in the air is treated as his own echo:
// `spot.hush` is pushed forward on every frame his voice is playing — the whole time, not only
// while his mouth is shaping a phoneme, since the gaps between words are still audio coming out of
// the speakers.
//
// That guard used to apply during his turn too, which made a spoken interrupt impossible. Its
// stated justification was that he says his own name constantly — he does not, speaking *as* him
// he almost never says it. So during his turn the guard steps aside and his name means "stop"
// (see onWake).
const spot = { want: false, hush: 0, lastAt: 0, statusAt: 0, woke: 0, echoed: 0, last: null, agent: 'idle' };
const SPOT_TAIL_MS = 1500;     // how long after his last word a wake is still considered his echo
window.SPOTTER.onWake = (score) => {
  const now = performance.now();
  // Saying his name mid-reply means "stop", the same thing clicking him means. What protects this
  // from his own voice is echo cancellation on the capture, which is on — and a false one here
  // costs an interrupted sentence, not a wrong action.
  const interrupting = spot.agent !== 'idle' && settings.voiceInterrupt !== false;
  // Outside his turn, `hush` only covers audio already playing, and his very first false wake
  // scored 0.973 in the same second his reply began — too close to call. The relay reports
  // "speaking" before the first sample reaches the speakers, which closes that gap at the front.
  const echo = !interrupting && (now < spot.hush + SPOT_TAIL_MS || spot.agent === 'speaking');
  // Kept either way, because "he keeps waking himself" and "he never wakes" need telling apart
  // from outside this window (`claude-glass stored calcifer`, wakeStatus.last).
  spot.last = { at: new Date().toISOString(), score: +score.toFixed(3), echo,
                agent: spot.agent, cutOff: interrupting };
  if (echo) return void spot.echoed++;
  if (now - spot.lastAt < 2000) return;            // one wake per utterance
  spot.lastAt = now;
  spot.woke++;
  if (interrupting) return void bargeIn();
  setPosture('open');
};
// He doesn't answer out loud when his mic opens. A spoken "mm-hm?" was one more thing for the mic
// to pick up, and the only acknowledgement that matters is Claude taking the work — which the
// acknowledge hook speaks through the relay instead.
window.EARS.onStatus = (earStatus) => glass.store({ earStatus });

// Browsers may hold audio until a gesture; any click on him resumes it.
addEventListener('pointerdown', () => feed.player?.resume().catch(() => {}));
addEventListener('keydown', () => feed.player?.resume().catch(() => {}));

// ---------- Not falling asleep in the middle of a sentence ----------
// Borrowed from vmux's own useKeepAwake: hold a screen wake lock while a conversation is actually
// open. The display sleeping mid-conversation is what suspends every audio context in here, and
// no amount of resuming afterwards recovers the words that were said in the meantime.
//
// Only while the mic is open, never while merely waiting to be called — listening for a name all
// afternoon is no reason to stop the machine ever sleeping. vmux also plays silent audio to keep
// mobile tabs alive and deliberately skips that on desktop, because there it would block system
// sleep outright; so that part is left out.
const awake = { sentinel: null, want: false, tried: 0 };
async function keepAwake(want, now) {
  awake.want = want;
  try {
    if (want && !awake.sentinel && now - awake.tried > 5000) {
      awake.tried = now;
      const wl = navigator.wakeLock;
      if (!wl) return;
      const s = await wl.request('screen');
      // The browser releases it on its own when the document is hidden; notice, so it can be taken
      // again when he comes back.
      s.addEventListener?.('release', () => { if (awake.sentinel === s) awake.sentinel = null; });
      if (!awake.want) { await s.release(); return; }
      awake.sentinel = s;
    } else if (!want && awake.sentinel) {
      const s = awake.sentinel;
      awake.sentinel = null;
      await s.release();
    }
  } catch { awake.sentinel = null; }   // unsupported, or refused: not worth a word
}
// Mouth from the feed at this moment, or null when he isn't speaking.
// Subtitles a line or two at a time: the spoken words grouped into chunks that end at a sentence
// (or clause) once they're long enough, and never run past SUB_MAX characters. Each chunk shows
// from its first word's start, so the subtitle turns over with the voice.
const SUB_MIN = 45, SUB_MAX = 95;
function shortLines(words) { // words: [{ text, start }] -> [{ start, text }]
  const out = [];
  let cur = null;
  for (const w of words) {
    if (cur && cur.text.length + 1 + w.text.length > SUB_MAX) cur = null;
    if (!cur) { cur = { start: w.start, text: '' }; out.push(cur); }
    cur.text += (cur.text ? ' ' : '') + w.text;
    if (cur.text.length >= SUB_MIN && /[.!?…]["')\]]*$|[,;:—–]$/.test(w.text)) cur = null;
  }
  return out;
}
const subCache = { id: null, n: 0, lines: [] };
function feedMouth() {
  const f = feed.player?.frame();
  if (!f?.utteranceId) return null;
  const sp = feed.client.getState().speech[feed.sessionId];
  const word = sp ? window.LIPSYNC.wordAt(sp.words, f.t) : null;
  const shape = word ? window.LIPSYNC.mouthAt(word, f.t) : null;
  const words = sp?.words || [];
  if (subCache.id !== f.utteranceId || subCache.n !== words.length)
    Object.assign(subCache, { id: f.utteranceId, n: words.length, lines: shortLines(words.map((w) => ({ text: String(w.word), start: w.start }))) });
  let line = '';
  for (const c of subCache.lines) if (c.start <= f.t + 0.05) line = c.text;
  return {
    shape,                              // phoneme (or spelling) shape now; null between words
    loud: Math.min(1, f.level * 1.6),   // how loud the voice is right now, 0..1
    line,
  };
}

// ---------- Text + audio sync ----------
// Follows the reply text along the real audio. A cursor into the text's timeline advances only
// while sound is playing, and re-syncs on what it hears:
//   - a fresh onset (quiet -> loud) snaps it to the nearest syllable start
//   - a real pause in the audio jumps it to the next punctuation pause in the text, and the
//     next onset after that starts the following phrase's first syllable
// (The "both" mode that re-aligned an estimated text timeline against live audio loudness went with
// the audio-input path: the feed carries real timings, so there is nothing left to re-align.)

// ---------- Fire shader ----------
const fireCv = document.createElement('canvas'); // offscreen: composited into the one visible canvas

// ---------- Assets ----------
const hearthImg = new Image(); hearthImg.src = HEARTH.src;
// Things hanging in the room, each its own layer cut from the painting (assets/sway.js)

// The allowance props, drawn flat on the stone: no hook, no sway, no physics. (Not `props` —
// that name already belongs to the glass's own state for this window.)
//
// A prop is either a single image or a set of levels keyed 0..100 in tens, one per tenth of the
// window it stands for. Every level is loaded up front: they are small, and swapping to one that
// has not decoded yet would blink a gap into the hearth.

// Which window each prop stands for. `kindling` burns down over the five-hour window, the fast one

const PROP_LIMIT = { kindling: 'session', logs: 'week' };

// ---------- Wind ----------
// Now and then a soft gust drifts through: it builds over a couple of seconds, holds, and dies
// away. Everything hanging swings with it from its hook, the gust reaching each one a moment
// later as it crosses the room, and his flame leans with it.
const wind = { gust: 0, target: 0, until: 0, next: performance.now() + 4000 }; // a first breath of air soon after he appears
function updateWind(now, dt) {
  if (now > wind.next) {
    wind.target = 0.6 + Math.random() * 0.4;
    wind.until = now + 3000 + Math.random() * 4000;
    wind.next = wind.until + 12000 + Math.random() * 25000;
  }
  if (now > wind.until) wind.target = 0;
  wind.gust = lerp(wind.gust, wind.target, 1 - Math.pow(wind.target > wind.gust ? 0.45 : 0.6, dt));

// How far a thing at horizontal position x (0..1 of the room) is blown right now, in radians

// ---------- What he's working on, as wisps of his own flame ----------
// A hook pushes each command into the stored value `doing`; this lifts it off him and lets it thin
// out the way the fire does. The point is telling "working" from "sitting there" at a glance, so it
// has to read as part of the scene rather than as a caption laid over it.
const wisps = [];
const WISP_MS = 4200;      // how long one wisp takes to climb and vanish
const WISP_LINE = 22;      // characters per wisp; longer reads as a banner, not as smoke
let doingSeen = null;

function spawnWisp(text) {
  const clean = String(text || '').replace(/\s+/g, ' ').trim();
  if (!clean) return;
  // Broken into a few short pieces at word boundaries, so several wisps lift off in sequence
  // instead of one long line sliding up.
  const pieces = [];
  let line = '';
  for (const w of clean.split(' ')) {
    if (line && (line + ' ' + w).length > WISP_LINE) { pieces.push(line); line = w; }
    else line = line ? `${line} ${w}` : w;
    if (pieces.length >= 3) break;
  }
  if (line && pieces.length < 3) pieces.push(line);

  pieces.forEach((p, i) => wisps.push({
    text: p.length > WISP_LINE + 6 ? `${p.slice(0, WISP_LINE + 4)}…` : p,
    born: now + i * 300, seed: Math.random() * 10, side: (Math.random() - 0.5) * 0.6,

function drawWisps(cx, cy, R, t, now) {
  if (settings.commandWisps === false || !wisps.length) return;
  const size = Math.max(8, R * 0.17 * ((settings.commandWispSize ?? 100) / 100));

  fg.font = font;

    const w = wisps[i];
    const age = (now - w.born) / WISP_MS;
    if (age >= 1) { wisps.splice(i, 1); continue; }
    if (age < 0) continue;

    const a = Math.min(1, age * 7) * Math.pow(1 - age, 1.7) * 0.9;
    const y = cy - R * (0.95 + age * 2.7);

    // not cheap, and the old version called it twice per character per frame — for a dozen wisps
    // of twenty-odd characters at sixty frames a second, that was tens of thousands of text
    // measurements a second on top of the whole scene.
    if (w.size !== size) {

      w.font = font;

      w.total = w.widths.reduce((sum, v) => sum + v, 0);

      // grows as it climbs, so it is legible near him and comes apart higher up.

// ---------- Helpers ----------

// ---------- Hearth: the painting, dimmed, then lit by him ----------

  c.drawImage(hearthImg, S.dx, S.dy, S.iw, S.ih);

  for (const p of sceneProps) {

  // Mouth follows speech like a drawn jaw: snaps open, snaps nearly as fast back shut, presses on m/b/p
  if (!talking && act?.wide !== undefined) wide = act.wide;
  talkMix = lerp(talkMix, talking ? 1 : 0, 1 - Math.pow(talking ? 1e-4 : 0.02, dt)); // in fast, out gently
  const targetOpen = talking ? Math.min(1, amp * 0.85) : act?.open ?? rig.open;
  // A feed gives exact targets per sound, so follow them more tightly (still eased, so it reads
  // as a jaw, not a flicker).
  const tight = !!m && talking;   // the feed gives exact targets; an estimated timeline does not
  const rate = press ? 1e-7 : tight ? (targetOpen > rig.mouthOpen ? 1e-9 : 1e-8) : targetOpen > rig.mouthOpen ? 1e-6 : 3e-6;
  // The mouth eases outside the pose loop, towards numbers that come from the speech feed's own
  // levels and phonemes, so it gets the same treatment: bounded targets, never a bare value.
  rig.mouthOpen = lerp(rig.mouthOpen, clamp(fin(targetOpen, 0), 0, 1.2), 1 - Math.pow(rate, dt));
  const wideTarget = talking || act?.wide !== undefined ? wide : rig.wide;
  rig.mouthWide = lerp(rig.mouthWide, clamp(fin(wideTarget, BASE.wide), 0, 1.5), 1 - Math.pow(tight ? 1e-7 : 1e-4, dt));
  sub.textContent = line; sub.classList.toggle('on', !!(settings.subtitles && line));
  lastTalking = talking;   // read on the next frame, to keep idle fidgets out of his sentences

  // Blinks and glances
  if (now > blinkAt && blinkT < 0) blinkT = 0;
  let open = 1;
  if (blinkT >= 0) { blinkT += dt; open = Math.abs(1 - blinkT / 0.07); if (blinkT > 0.14) { blinkT = -1; blinkAt = now + 2000 + Math.random() * 4500; open = 1; } }
  if (gazeHeld) { lookX = lookY = 0; }
  else if (now > lookUntil) {
    const around = B.gaze?.mode === 'around';
    const idle = around || (shown === 'neutral' && st.activity === 'idle');
    lookX = idle && Math.random() < 0.7 ? (Math.random() - 0.5) * 1.2 : 0; lookY = idle ? (Math.random() - 0.5) * 0.5 : 0;
    lookUntil = now + (around ? 350 + Math.random() * 500 : 1400 + Math.random() * 3200);
  }
  if (shown === 'asleep') open = 1; // no blinking in his sleep (the lids are already shut)
  // Opened up, he reads along: his eyes, either side of it, look a little down into the terminal.
  const z = tickCore(dt), ez = z * z * (3 - 2 * z);
  if (ez > 0.5 && !gazeHeld) lookY = 0.3;

  // Layout: he sits behind the log, centered on it
  const S = stage(W, H);
  const L = S.log;
  const logCx = S.dx + LOG.cx * S.iw, logTop = S.dy + LOG.topY * S.ih;
  // His size and seat come from the log itself in the painting, not from how log.png is cropped
  const logW = LOG.span * S.iw, logH = LOG.thick * S.ih;
  const R0 = logW * 0.44;
  const size = clamp(fin(rig.size, 1) + fin(rig.impulse, 0) + fin(amp, 0) * 0.05 + 0.025 * Math.sin(t * 1.9), 0.35, 2.6);
  // Muting him silences the whole hearth, not just his voice: crackle, effects and all.
  window.SOUNDS?.tick({ on: settings.sounds !== false && !stored.muted, ambience: settings.ambience !== false, volume: (settings.soundVolume ?? 35) / 100,
    size, sway: rig.sway ?? 1, asleep: shown === 'asleep' });
  const Rseat = R0 * size;
  const jit = (rig.tremble * 0.014 + rig.shake * 0.035) * R0;
  const cxSeat = logCx + (Math.random() - 0.5) * jit + noise(t * 0.6, 3) * R0 * 0.02;
  const cySeat = logTop + logH * 0.15 - Rseat * 0.62 + (Math.random() - 0.5) * jit + (act?.dy ?? 0) * R0;
  // Opened up, he swells off the log to fill the glass: his round body (about one radius across,
  // a little more below) covers it, and his tongues lick out past the top. His moods still breathe
  // in it, just gently.
  const R = lerp(Rseat, Math.max(W * 0.62, H * 0.72) * (0.96 + 0.04 * size), ez);
  const cx = lerp(cxSeat, W / 2, ez), cy = lerp(cySeat, H * 0.6, ez);
  const glow = (0.55 + 0.45 * size + 0.12 * noise(t * 4, 9)) * (stored.muted ? 0.7 : 1);

  // How often anything takes a new pose. Hand-drawn animation holds each drawing for two frames
  // rather than redrawing every one, and the whole scene is built to look like that film — so the
  // flame, the herbs hanging in the room and the shader all step together, off one number. Set it
  // to 0 and nothing steps: every frame is its own pose, which reads as smooth rather than drawn.
  const stepRate = Math.max(0, settings.stepRate ?? 12);
  const stepped = (v) => (stepRate > 0 ? Math.floor(v * stepRate) : -1);

  updateSwayers(dt, t);
  // The hanging things take their pose on the same beat as his flame
  const sceneNow = stepped(t);
  if (stepRate <= 0) { for (const s of swayers) s.shown = s.ang; }
  else if (sceneNow !== sceneStep) { sceneStep = sceneNow; for (const s of swayers) s.shown = s.ang; }
  drawHearth(W, H, S, cx, cy, glow);

  // Body
  if (gl && prog) {
    gl.viewport(0, 0, fireCv.width, fireCv.height);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(uni.uRes, fireCv.width, fireCv.height);
    gl.uniform1f(uni.uTime, t);
    gl.uniform2f(uni.uCenter, cx * fireDpr, cy * fireDpr);
    gl.uniform1f(uni.uR, R * fireDpr);
    gl.uniform1f(uni.uSway, rig.sway);
    flameClock += dt * rig.sway;
    // The same beat for his flame, whatever his mood — a slow, sad flame moves less per step
    // rather than taking fewer steps. Smooth (0) hands the clock straight through.
    const step = stepped(t);
    if (stepRate <= 0) flameHeld = flameClock;
    else if (step !== flameStep) { flameStep = step; flameHeld = flameClock; }
    gl.uniform1f(uni.uFlame, flameHeld);
    gl.uniform1f(uni.uStep, stepRate);
    gl.uniform1f(uni.uLean, rig.lean);
    gl.uniform1f(uni.uGlow, glow);
    gl.uniform1f(uni.uAlpha, BODY_ALPHA * (stored.muted ? 0.75 : 1));
    gl.uniform3fv(uni.uC0, rig.pal[0]); gl.uniform3fv(uni.uC1, rig.pal[1]); gl.uniform3fv(uni.uC2, rig.pal[2]);
    gl.uniform3fv(uni.uCore, mix3(rig.pal[2], CORE_LIGHT, 0.55));
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  // Composite: the lit painting, his body, then the face, the log in front of him, his arms round it
  fg.clearRect(0, 0, W, H);
  fg.drawImage(bgCv, 0, 0, W, H);
  if (gl && prog) fg.drawImage(fireCv, 0, 0, W, H);
  const Fseat = R0 * Math.pow(size, 0.55);
  const faceX = cxSeat + rig.lean * Rseat * 0.3, eyeYSeat = cySeat - Rseat * 0.06, mouthYSeat = cySeat + Rseat * 0.24;
  // Opened up, he's seen up close, so his face is bigger, and it parts round the terminal: an eye
  // in a margin either side of it, the mouth below it. The margins are sized to his eyes (with
  // room for a wide-eyed mood), so however narrow the glass gets the terminal never covers them;
  // on a wide glass the terminal stops at 1100px and the margins just grow.
  const FEopen = Math.min(H * 0.3, W * 0.24);
  const margin = Math.round(FEopen * 0.16 * 1.3 * 2 + 28);
  const pw = Math.max(200, Math.min(W - margin * 2, 1100)), pLeft = (W - pw) / 2, pTop = H * 0.16, pBottom = H * 0.82;
  if (core.width !== pw) { core.width = pw; coreEl.style.width = pw + 'px'; window.HEARTH_TERM.fitLocal(); }
  const F = lerp(Fseat, Math.min(H * 0.26, W * 0.2), ez);          // the mouth
  const FE = lerp(Fseat, FEopen, ez);                                // the eyes, a touch bigger still
  const gap = Fseat * 0.4;
  const eyeLX = lerp(faceX - gap, pLeft - margin / 2, ez);
  const eyeRX = lerp(faceX + gap, W - pLeft + margin / 2, ez);
  const eyeY = lerp(eyeYSeat, pTop + H * 0.13, ez);
  const mouthX = lerp(faceX, W / 2, ez), mouthY = lerp(mouthYSeat, (pBottom + H) / 2, ez);
  // The face is painted opaque on a small offscreen canvas around it, then laid onto the front
  // layer at FACE_ALPHA, so overlapping strokes don't double up (and no extra full-window layer).
  // Seated, eyes and mouth share one; opened up they're far apart, so each gets its own pass
  // rather than one canvas the height of the glass.
  const fs = Math.min(dpr, 2);
  const paintFace = (ox, oy, fw, fh, draw) => {
    fw = Math.ceil(fw); fh = Math.ceil(fh);
    if (faceCv.width !== Math.ceil(fw * fs) || faceCv.height !== Math.ceil(fh * fs)) { faceCv.width = Math.ceil(fw * fs); faceCv.height = Math.ceil(fh * fs); }
    faceCtx.setTransform(fs, 0, 0, fs, -ox * fs, -oy * fs);
    faceCtx.clearRect(ox, oy, fw, fh);
    draw();
    fg.save(); fg.globalAlpha = FACE_ALPHA; fg.drawImage(faceCv, ox, oy, fw, fh); fg.restore();
  };
  // Opened up, each eye looks in at the terminal between them (gaze is shared, so it's set per eye).
  const eye = (x, side) => {
    const was = lookX;
    if (ez > 0.5 && !gazeHeld) lookX = -side * 0.6;
    drawEye(x, eyeY, FE, side, open);
    lookX = was;
  };
  const mouth = () => drawMouth(mouthX, mouthY, F, t);
  if (ez < 0.01) paintFace(faceX - F * 0.9, eyeY - F * 0.6, F * 1.8, mouthY - eyeY + F * 1.35, () => { eye(eyeLX, -1); eye(eyeRX, 1); mouth(); });
  else {
    paintFace(eyeLX - FE * 0.5, eyeY - FE * 0.6, FE, FE * 1.2, () => eye(eyeLX, -1));
    paintFace(eyeRX - FE * 0.5, eyeY - FE * 0.6, FE, FE * 1.2, () => eye(eyeRX, 1));
    paintFace(mouthX - F * 0.9, mouthY - F * 0.75, F * 1.8, F * 1.5, mouth);
  }
  // The log and his arms stay with the hearth; opened up, he has let go of them.
  fg.save(); fg.globalAlpha = 1 - ez;
  if (ez < 0.99 && logImg.complete && logImg.naturalWidth) {
    // The log, lit by him. Lit on its own small canvas first, so the light touches only the log
    // (on the front layer it would also tint his face where it dips into the log's area).
    const ls = Math.min(dpr, 2), lw = Math.ceil(L.w * ls), lh = Math.ceil(L.h * ls);
    if (logCv.width !== lw || logCv.height !== lh) { logCv.width = lw; logCv.height = lh; }
    logCtx.setTransform(ls, 0, 0, ls, -L.x * ls, -L.y * ls);
    logCtx.globalCompositeOperation = 'source-over';
    logCtx.clearRect(L.x, L.y, L.w, L.h);
    logCtx.drawImage(logImg, L.x, L.y, L.w, L.h);
    logCtx.globalCompositeOperation = 'source-atop';
    const lg = logCtx.createRadialGradient(cxSeat, logTop, 0, cxSeat, logTop, logW * 0.6);
    lg.addColorStop(0, css(rig.pal[1], 0.35 * glow)); lg.addColorStop(1, 'rgba(0,0,0,0)');
    logCtx.fillStyle = lg; logCtx.fillRect(L.x, L.y, L.w, L.h);
    fg.drawImage(logCv, L.x, L.y, L.w, L.h);
  }
  fg.globalAlpha = Math.min(1, BODY_ALPHA + 0.1) * (1 - ez); // arms a touch more solid than his body: they're in front of the log
  if (ez < 0.99) drawArms(cxSeat, logTop, logH, R0 * Math.pow(size, 0.4), t, talking, (act?.dy ?? 0) * R0, faceX, eyeYSeat);
  fg.restore();
  fg.globalAlpha = 1;
  drawAshes(S, ears, t, dt);
  hit.fire = { x: cx, y: cy, r: R * 0.9 };

  if (Math.random() < rig.embers * dt * 12) embers.push({ x: (Math.random() - 0.5) * 0.8, y: 1.3, vx: (Math.random() - 0.5) * 0.5, vy: 0.7 + Math.random() * 0.9, life: 1, big: false });
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i];
    e.x += e.vx * dt + Math.sin(t * 3 + i) * 0.004; e.y += e.vy * dt; e.vy -= 0.25 * dt; e.life -= dt * 0.6;
    if (e.life <= 0 || embers.length > 180) { embers.splice(i, 1); continue; }
    const ex = cx + e.x * R, ey = cy - e.y * R;
    // One glow sprite, stamped: a shadowBlur per ember was a GPU blur pass each, every frame.
    const r = (e.big ? 2.6 : 1.5) * (0.5 + e.life * 0.5), s = emberSprite(), d = (r + 6) * 2;
    fg.globalAlpha = Math.max(0, Math.min(1, e.life));
    fg.drawImage(s, ex - d / 2, ey - d / 2, d, d);
  }
  fg.globalAlpha = 1;
  drawWisps(cx, cy, R, t, now);   // last, so what he's working on rises in front of his own embers
}
schedule();
glass.onState(onProps);
</script>
</body>
</html>
